<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yu-Gi-Oh! Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar bg-dark shadow mb-4" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fs-3" href="index.html">YGO Dex</a>
      <div class="row g-2 flex-grow-1 ms-lg-4">
        <div class="col-md-7">
          <input id="search" class="form-control" type="search" placeholder="Search card name..." aria-label="Search cards">
        </div>
        <div class="col-md-5">
          <select id="type" class="form-select" aria-label="Card type">
            <option value="">All card types</option>
            <option>Normal Monster</option><option>Effect Monster</option><option>Flip Effect Monster</option>
            <option>Fusion Monster</option><option>Ritual Monster</option><option>Synchro Monster</option>
            <option>XYZ Monster</option><option>Pendulum Effect Monster</option><option>Link Monster</option>
            <option>Spell Card</option><option>Trap Card</option>
          </select>
        </div>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div id="count" class="text-secondary"></div>
      <ul class="pagination mb-0">
        <li class="page-item"><a class="page-link" role="button" onclick="prev()">Previous</a></li>
        <li class="page-item disabled"><span class="page-link" id="currentPage">1</span></li>
        <li class="page-item"><a class="page-link" role="button" onclick="next()">Next</a></li>
      </ul>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6 g-3" id="grid"></div>

    <nav class="d-flex justify-content-center mt-4" aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" role="button" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" role="button" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    const colors = {
      Normal: 'warning',
      Effect: 'danger',
      Ritual: 'info',
      Fusion: 'primary',
      Synchro: 'light',
      XYZ: 'dark',
      Link: 'primary',
      Spell: 'success',
      Trap: 'secondary',
    };

    function getColor(type) {
      for (var key in colors) {
        if (type.includes(key)) return colors[key];
      }
      return 'secondary';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');
    var search = urlParams.get('q');
    var type = urlParams.get('type');

    page = page == null ? 1 : parseInt(page);
    search = search == null ? '' : search;
    type = type == null ? '' : type;

    var perPageLoad = 24;
    var lastPage = 1;

    var elParent = document.getElementById("grid");
    var elCurrentPage = document.getElementById("currentPage");
    var elCount = document.getElementById("count");
    var elSearch = document.getElementById("search");
    var elType = document.getElementById("type");

    elSearch.value = search;
    elType.value = type;

    const getCards = async () => {
      elParent.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
      elCurrentPage.innerHTML = page;

      var url = 'https://db.ygoprodeck.com/api/v7/cardinfo.php?num=' + perPageLoad + '&offset=' + (perPageLoad * (page - 1));
      if (search != '') url += '&fname=' + encodeURIComponent(search);
      if (type != '') url += '&type=' + encodeURIComponent(type);

      var response = await fetch(url);
      var result = await response.json();

      if (!result.data) {
        elParent.innerHTML = '<div class="col-12"><div class="alert alert-warning">No cards found. Try a different name or card type.</div></div>';
        elCount.innerHTML = '0 cards';
        lastPage = 1;
        return;
      }

      lastPage = result.meta.total_pages;
      elCount.innerHTML = result.meta.total_rows + ' cards';
      elParent.innerHTML = '';

      for (var i = 0; i < result.data.length; i++) {
        var card = result.data[i];

        var id = card.id;
        var name = card.name;
        var cardType = card.type;
        var picture = card.card_images[0].image_url_small;
        var color = getColor(cardType);
        var stats = card.atk !== undefined ? 'ATK ' + card.atk : '';
        if (card.def !== undefined) stats += ' / DEF ' + card.def;

        elParent.innerHTML += `
          <div class="col">
            <div class="card h-100 shadow-sm">
              <img class="card-img-top" loading="lazy" src="` + picture + `">
              <div class="card-body p-2">
                <a class="card-title h6 d-block stretched-link text-decoration-none" href="view.html?id=` + id + `&page=` + page + `&q=` + encodeURIComponent(search) + `&type=` + encodeURIComponent(type) + `">` + escapeHtml(name) + `</a>
                <span class="badge text-bg-` + color + `">` + escapeHtml(cardType) + `</span>
                <div class="small text-secondary mt-1">` + stats + `</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function prev() {
      page -= 1;
      if (page == 0) {
        page = lastPage;
      }
      getCards();
    }

    function next() {
      page += 1;
      if (page > lastPage) {
        page = 1;
      }
      getCards();
    }

    function filter() {
      search = elSearch.value.trim();
      type = elType.value;
      page = 1;
      getCards();
    }

    elSearch.addEventListener('change', filter);
    elType.addEventListener('change', filter);

    getCards();
  </script>
</body>
</html>
