<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card – YGO Dex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar bg-dark shadow mb-4" data-bs-theme="dark">
    <div class="container"><a class="navbar-brand fs-3" href="index.html">YGO Dex</a></div>
  </nav>

  <main class="container pb-5">
    <a id="backlink" class="btn btn-secondary mb-3" href="index.html">Back to cards</a>
    <div id="content" class="text-center py-5">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    const colors = {
      Normal: 'warning',
      Effect: 'danger',
      Ritual: 'info',
      Fusion: 'primary',
      Synchro: 'light',
      XYZ: 'dark',
      Link: 'primary',
      Spell: 'success',
      Trap: 'secondary',
    };

    function getColor(type) {
      for (var key in colors) {
        if (type.includes(key)) return colors[key];
      }
      return 'secondary';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = urlParams.get('id');
    var page = urlParams.get('page');
    var search = urlParams.get('q');
    var type = urlParams.get('type');
    page = page == null ? 1 : page;
    search = search == null ? '' : search;
    type = type == null ? '' : type;

    var elContent = document.getElementById("content");
    var elBacklink = document.getElementById("backlink");

    elBacklink.href = "index.html?page=" + page + "&q=" + encodeURIComponent(search) + "&type=" + encodeURIComponent(type);

    function row(label, value) {
      if (value === undefined || value === null || value === '') return '';
      return '<dt class="col-sm-4">' + label + '</dt><dd class="col-sm-8">' + escapeHtml(String(value)) + '</dd>';
    }

    const getCard = async (id) => {
      var response = await fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php?id=' + id);
      var result = await response.json();

      if (!result.data) {
        elContent.innerHTML = '<div class="alert alert-warning">Card not found.</div>';
        return;
      }

      var card = result.data[0];
      var color = getColor(card.type);
      var level = card.linkval != undefined ? card.linkval : card.level;
      var levelLabel = card.type.includes('Link') ? 'Link rating' : card.type.includes('XYZ') ? 'Rank' : 'Level';
      var price = card.card_prices && card.card_prices[0] ? card.card_prices[0].tcgplayer_price : '';
      var sets = '';

      if (card.card_sets) {
        for (var i = 0; i < card.card_sets.length && i < 8; i++) {
          var s = card.card_sets[i];
          sets += '<tr><td>' + escapeHtml(s.set_name) + '</td><td>' + escapeHtml(s.set_code) + '</td><td>' + escapeHtml(s.set_rarity) + '</td></tr>';
        }
      }

      document.title = card.name + ' – YGO Dex';
      elContent.className = 'row g-4';
      elContent.innerHTML = `
        <div class="col-md-5 col-lg-4 text-center">
          <img class="img-fluid rounded shadow" src="` + card.card_images[0].image_url + `">
        </div>
        <div class="col-md-7 col-lg-8">
          <div class="card shadow">
            <div class="card-body p-4">
              <h1 class="card-title display-6">` + escapeHtml(card.name) + `</h1>
              <span class="badge text-bg-` + color + ` mb-3">` + escapeHtml(card.type) + `</span>
              <dl class="row">
                ` + row('Attribute', card.attribute) + `
                ` + row('Race / Type', card.race) + `
                ` + row(levelLabel, level) + `
                ` + row('ATK', card.atk) + `
                ` + row('DEF', card.def) + `
                ` + row('Archetype', card.archetype) + `
                ` + row('TCGplayer price', price ? '$' + price : '') + `
              </dl>
              <h2 class="h5">Card text</h2>
              <p class="text-break">` + escapeHtml(card.desc).replace(/\n/g, '<br>') + `</p>
              ` + (sets == '' ? '' : `<h2 class="h5 mt-4">Printings</h2>
              <div class="table-responsive"><table class="table table-sm table-striped mb-0">
                <thead><tr><th>Set</th><th>Code</th><th>Rarity</th></tr></thead><tbody>` + sets + `</tbody></table></div>`) + `
            </div>
          </div>
        </div>
      `;
    }

    if (id != null) {
      getCard(id);
    }
  </script>
</body>
</html>
